name: CI - Aula 11 (Web Scraping – BeautifulSoup)

on:
  push:
    branches: [ "master" ]
    paths:
      - "AULA11/**"
      - "tests/test_aula11.py"
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches: [ "master" ]
    paths:
      - "AULA11/**"
      - "tests/test_aula11.py"

jobs:
  validar_aula11:
    name: Lint e Testes – AULA11
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest requests beautifulsoup4

      - name: Verificar existência do script
        run: |
          if [ ! -f "AULA11/scraper_noticias.py" ]; then
            echo "❌ AULA11/scraper_noticias.py não encontrado."
            exit 1
          fi

      - name: Verificar Sintaxe Python (py_compile)
        run: |
          python -m py_compile AULA11/scraper_noticias.py

      - name: Executar Testes Estruturais
        run: |
          if [ -f "tests/test_aula11.py" ]; then
            pytest tests/test_aula11.py -v
          else
            echo "⚠ Testes não encontrados – apenas lint executado."
          fi
