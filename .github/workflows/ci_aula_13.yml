name: CI - Aula 13 (Filas, Async e Retry Pattern)

on:
  push:
    branches: [ "master" ]
    paths:
      - "AULA13/**"
      - "tests/test_aula13.py"
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches: [ "master" ]
    paths:
      - "AULA13/**"
      - "tests/test_aula13.py"

jobs:
  validar_aula13:
    name: Lint e Testes – AULA13
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest tenacity

      - name: Verificar existência do script
        run: |
          if [ ! -f "AULA13/bot_faturamento_avancado.py" ]; then
            echo "❌ AULA13/bot_faturamento_avancado.py não encontrado."
            exit 1
          fi

      - name: Validar Sintaxe (flake8) – AULA13
        run: |
          flake8 AULA13/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Avaliar PEP8 – AULA13
        run: |
          flake8 AULA13/ --count --max-complexity=10 --max-line-length=127 --statistics

      - name: Verificar Sintaxe Python (py_compile)
        run: |
          python -m py_compile AULA13/bot_faturamento_avancado.py

      - name: Executar Bot de Faturamento
        run: |
          python AULA13/bot_faturamento_avancado.py || true

      - name: Verificar geração de log (app_rpa.log)
        run: |
          if [ -f app_rpa.log ]; then
            LINE_COUNT=$(wc -l < app_rpa.log)
            echo "✔ app_rpa.log criado com $LINE_COUNT linha(s)."
          else
            echo "⚠ app_rpa.log não foi gerado (pode indicar erro na execução)."
          fi

      - name: Executar Testes Estruturais
        run: |
          if [ -f "tests/test_aula13.py" ]; then
            pytest tests/test_aula13.py -v
          else
            echo "⚠ Testes não encontrados – apenas lint executado."
          fi
