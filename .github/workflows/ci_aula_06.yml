name: CI - Aula 06 (PyAutoGUI – Notepad Bot)

on:
  push:
    branches: [ "master" ]
    paths:
      - "AULA06/**"
      - "tests/test_aula06.py"
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches: [ "master" ]
    paths:
      - "AULA06/**"
      - "tests/test_aula06.py"

jobs:
  validar_aula06:
    name: Lint e Testes – AULA06
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pyautogui

      - name: Verificar existência do script
        run: |
          if [ ! -f "AULA06/notepad_bot.py" ]; then
            echo "❌ AULA06/notepad_bot.py não encontrado."
            exit 1
          fi

      - name: Verificar Sintaxe Python (py_compile)
        run: |
          python -m py_compile AULA06/notepad_bot.py

      - name: Executar Testes Estruturais
        run: |
          if [ -f "tests/test_aula06.py" ]; then
            pytest tests/test_aula06.py -v
          else
            echo "⚠ Testes não encontrados – apenas lint executado."
          fi
