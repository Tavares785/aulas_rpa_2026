name: CI - Aula 09 (Selenium Avançado – Dropdowns e Alerts)

on:
  push:
    branches: [ "master" ]
    paths:
      - "AULA09/**"
      - "tests/test_aula09.py"
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches: [ "master" ]
    paths:
      - "AULA09/**"
      - "tests/test_aula09.py"

jobs:
  validar_aula09:
    name: Lint e Testes – AULA09
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest selenium webdriver-manager

      - name: Verificar existência do script
        run: |
          if [ ! -f "AULA09/web_avancado.py" ]; then
            echo "❌ AULA09/web_avancado.py não encontrado."
            exit 1
          fi

      - name: Verificar Sintaxe Python (py_compile)
        run: |
          python -m py_compile AULA09/web_avancado.py

      - name: Executar Testes Estruturais
        run: |
          if [ -f "tests/test_aula09.py" ]; then
            pytest tests/test_aula09.py -v
          else
            echo "⚠ Testes não encontrados – apenas lint executado."
          fi
