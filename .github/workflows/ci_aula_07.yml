name: CI - Aula 07 (Lançamento de Notas – PyAutoGUI)

on:
  push:
    branches: [ "master" ]
    paths:
      - "AULA07/**"
      - "tests/test_aula07.py"
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches: [ "master" ]
    paths:
      - "AULA07/**"
      - "tests/test_aula07.py"

jobs:
  validar_aula07:
    name: Lint e Testes – AULA07
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pyautogui

      - name: Detectar script principal da AULA07
        id: detect_script
        run: |
          # Busca qualquer .py na pasta AULA07
          SCRIPT=$(find AULA07/ -name "*.py" -not -name "test_*" | head -1)
          if [ -z "$SCRIPT" ]; then
            echo "❌ Nenhum script Python encontrado em AULA07/"
            exit 1
          fi
          echo "script=$SCRIPT" >> $GITHUB_OUTPUT
          echo "✔ Script encontrado: $SCRIPT"

      - name: Validar Sintaxe (flake8) – AULA07
        run: |
          flake8 AULA07/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Avaliar PEP8 – AULA07
        run: |
          flake8 AULA07/ --count --max-complexity=10 --max-line-length=127 --statistics

      - name: Verificar Sintaxe Python (py_compile)
        run: |
          python -m py_compile ${{ steps.detect_script.outputs.script }}

      - name: Executar Testes Estruturais
        run: |
          if [ -f "tests/test_aula07.py" ]; then
            pytest tests/test_aula07.py -v
          else
            echo "⚠ Testes não encontrados – apenas lint executado."
          fi
