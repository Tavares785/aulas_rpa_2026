name: CI - Aula 14 (Estrutura de Repositório)

on:
  push:
    branches: [ "master" ]
    paths:
      - "AULA14/**"
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches: [ "master" ]
    paths:
      - "AULA14/**"

jobs:
  validar_aula14:
    name: Validar Estrutura de Repositório – AULA14
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Verificar presença de requirements.txt
        id: check_requirements
        run: |
          if [ -f "requirements.txt" ]; then
            echo "status=presente" >> $GITHUB_OUTPUT
            echo "✔ requirements.txt encontrado."
          else
            echo "status=ausente" >> $GITHUB_OUTPUT
            echo "❌ requirements.txt não encontrado na raiz."
            exit 1
          fi

      - name: Verificar presença e conteúdo de .gitignore
        id: check_gitignore
        run: |
          if [ ! -f ".gitignore" ]; then
            echo "❌ .gitignore não encontrado."
            exit 1
          fi
          echo "✔ .gitignore encontrado."

          ERROS=0
          if ! grep -qF '.venv' .gitignore; then
            echo "⚠ '.venv/' ausente no .gitignore."
            ERROS=$((ERROS+1))
          fi
          if ! grep -qF '*.log' .gitignore; then
            echo "⚠ '*.log' ausente no .gitignore."
            ERROS=$((ERROS+1))
          fi

          if [ "$ERROS" -gt 0 ]; then
            echo "❌ .gitignore incompleto ($ERROS regras faltando)."
            exit 1
          fi
          echo "✔ .gitignore contém as regras obrigatórias."

      - name: Verificar presença de README.md
        run: |
          if [ ! -f "README.md" ]; then
            echo "❌ README.md não encontrado."
            exit 1
          fi
          echo "✔ README.md encontrado."

      - name: Resumo
        run: |
          echo "=============================="
          echo "  AULA14 – Estrutura OK ✔"
          echo "=============================="
