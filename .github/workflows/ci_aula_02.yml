name: CI - Aula 02 (Controle de Fluxo e Decisão)

on:
  push:
    branches: [ "master" ]
    paths:
      - "AULA02/**"
      - "tests/test_aula02.py"
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches: [ "master" ]
    paths:
      - "AULA02/**"
      - "tests/test_aula02.py"

jobs:
  validar_aula02:
    name: Lint e Testes – AULA02
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11" ]

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Validar Sintaxe (flake8) – AULA02
        run: |
          flake8 AULA02/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Avaliar PEP8 – AULA02
        run: |
          flake8 AULA02/ --count --max-complexity=10 --max-line-length=127 --statistics

      - name: Executar Testes – validador_transacoes.py
        run: |
          pytest tests/test_aula02.py -v
