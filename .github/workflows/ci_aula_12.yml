name: CI - Aula 12 (API REST e Notificação SMTP e Gmail API)

on:
  push:
    branches: [ "master" ]
    paths:
      - "AULA12/**"
      - "tests/test_aula12.py"
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches: [ "master" ]
    paths:
      - "AULA12/**"
      - "tests/test_aula12.py"

jobs:
  validar_aula12:
    name: Lint e Testes – AULA12
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest

      - name: Verificar existência do script
        run: |
          if [ ! -f "AULA12/bot_cotacao_alerta.py" ]; then
            echo "❌ AULA12/bot_cotacao_alerta.py não encontrado."
            exit 1
          fi

      - name: Verificar Sintaxe Python (py_compile)
        run: |
          python -m py_compile AULA12/bot_cotacao_alerta.py

      - name: Verificar que credenciais do Google não foram commitadas
        run: |
          for f in credentials.json token.json AULA12/credentials.json AULA12/token.json; do
            if [ -f "$f" ]; then
              echo "❌ $f não deve ser commitado."
              exit 1
            fi
          done

      - name: Executar Testes Estruturais
        run: |
          if [ -f "tests/test_aula12.py" ]; then
            pytest tests/test_aula12.py -v
          else
            echo "⚠ Testes não encontrados – apenas lint executado."
          fi
